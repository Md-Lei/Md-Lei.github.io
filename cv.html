<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curriculum Vitae | Mike Dharen Luansing</title>
    <link rel="icon" href="resources/plogo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link href="resources/css/index.css" rel="stylesheet">

    <style>
        .cvContainer {
            max-width: 880px;
            margin: 0 auto;
            padding: 24px 16px;
            width: 100%;
        }

        .cvHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding: 10px 20px;
        }

        .cvActions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cvFrameWrapper {
            padding: 12px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .cvFrame {
            width: 100%;
            height: 80vh;
            min-height: 500px;
            border: none;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        .btnAction {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 13px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btnDownload {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        .btnDownload:hover {
            opacity: 0.95;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .navLinkItem {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .navLinkItem:hover {
            color: #fff;
        }

        @media (max-width: 768px) {
            .cvContainer {
                padding: 12px 8px;
            }

            .cvHeader {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding: 12px 16px;
                gap: 10px;
            }

            .cvActions {
                width: 100%;
                justify-content: center;
                gap: 12px;
            }

            .cvFrameWrapper {
                padding: 8px;
                border-radius: 16px;
            }

            .cvFrame {
                height: 75vh;
                min-height: 420px;
                border-radius: 8px;
            }

            .btnAction {
                padding: 6px 14px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .cvHeader {
                padding: 10px 12px;
            }

            .cvFrame {
                height: 70vh;
                min-height: 380px;
            }

            .btnAction {
                width: auto;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>


    <div class="glow glow1" aria-hidden="true"></div>
    <div class="glow glow2" aria-hidden="true"></div>
    <div class="glow glow3" aria-hidden="true"></div>

    <main class="cvContainer">

        <div class="cvHeader glass">
            <a href="index.html" class="brand">
                <img src="resources/plogo.png" alt="Logo">
                Mike Dharen Luansing
            </a>

            <div class="cvActions">
                <a href="index.html" class="navLinkItem">Home</a>

                <a href="resources/Luansing, Mike Dharen Lei F.pdf" download="Luansing, Mike Dharen Lei F.pdf"
                    class="btnAction btnDownload">
                    Download
                </a>
            </div>
        </div>


        <div class="cvFrameWrapper glass">
            <iframe src="resources/Luansing, Mike Dharen Lei F.pdf#view=FitH&toolbar=0" class="cvFrame"
                title="Mike Dharen Luansing CV"></iframe>
        </div>
    </main>

    <script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
